<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sposound - Music Player</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --bg-base: #121212;
      --bg-sidebar: #000000;
      --bg-card: #181818;
      --bg-card-hover: #282828;
      --primary: #1db954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .app-container { display: flex; flex: 1; height: calc(100vh - 90px); }
    .sidebar { width: 240px; background-color: var(--bg-sidebar); padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; }
    .brand-logo { color: var(--primary); font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    
    .main-content { flex: 1; background: linear-gradient(to bottom, #222222, var(--bg-base) 300px); padding: 32px; overflow-y: auto; }
    .search-box { width: 100%; max-width: 400px; padding: 12px 16px; border-radius: 20px; border: none; background-color: #242424; color: #fff; font-size: 14px; outline: none; margin-bottom: 24px; }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
    .card { background-color: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .card:hover { background-color: var(--bg-card-hover); }
    .card-img { width: 100%; aspect-ratio: 1; border-radius: 4px; object-fit: cover; margin-bottom: 12px; }
    .card-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-subtitle { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-section { height: 90px; background-color: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .track-info { display: flex; align-items: center; gap: 12px; width: 30%; }
    .track-cover { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; background-color: #242424; }
    .track-details .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .track-details .artist { font-size: 12px; color: var(--text-sub); }

    .player-center { width: 40%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .btn-play-circle { background-color: var(--text-main); color: #000; border-radius: 50%; padding: 8px; border: none; cursor: pointer; display: flex; }

    .progress-bar-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-sub); }
    .progress-bar { flex: 1; height: 4px; background-color: #4f4f4f; border-radius: 2px; cursor: pointer; appearance: none; outline: none; }
    .progress-bar::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }

    #yt-hidden-player { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand-logo">
        <svg style="width:28px;height:28px;fill:var(--primary)" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Sposound
      </div>
    </aside>

    <main class="main-content">
      <input type="text" id="search-input" class="search-box" placeholder="Buscar artista o canción..." onkeydown="if(event.key==='Enter') searchMusic(this.value)">
      <h2 id="section-title" style="margin-bottom: 20px;">Resultados</h2>
      <div class="grid-cards" id="cards-container"></div>
    </main>
  </div>

  <footer class="player-section">
    <div class="track-info">
      <img id="current-cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300" class="track-cover">
      <div class="track-details">
        <div id="current-title" class="title">Selecciona una pista</div>
        <div id="current-artist" class="artist">-</div>
      </div>
    </div>

    <div class="player-center">
      <button class="btn-play-circle" onclick="togglePlay()"><i data-lucide="play" id="play-icon"></i></button>
      <div class="progress-bar-container">
        <span id="time-current">0:00</span>
        <input type="range" id="seek-bar" class="progress-bar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
        <span id="time-duration">0:00</span>
      </div>
    </div>
  </footer>

  <div id="yt-hidden-player"></div>

  <script>
    let ytPlayer = null;
    let isPlayerReady = false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-hidden-player', {
        height: '1', width: '1',
        playerVars: { 'autoplay': 1, 'controls': 0 },
        events: {
          'onReady': () => { isPlayerReady = true; },
          'onStateChange': (e) => {
            const icon = document.getElementById('play-icon');
            icon.setAttribute('data-lucide', e.data === YT.PlayerState.PLAYING ? 'pause' : 'play');
            lucide.createIcons();
          }
        }
      });
    }

    async function searchMusic(query) {
      if (!query.trim()) return;
      const container = document.getElementById('cards-container');
      container.innerHTML = '<p>Buscando...</p>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<p>No se encontraron canciones.</p>';
          return;
        }

        container.innerHTML = '';
        data.results.forEach(track => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => playSong(track.id, track.title, track.artist, track.cover);

          card.innerHTML = `
            <img src="${track.cover}" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300'">
            <div class="card-title">${track.title}</div>
            <div class="card-subtitle">${track.artist}</div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="color:#ff5555;">Error al buscar canciones.</p>';
      }
    }

    function playSong(id, title, artist, cover) {
      if (!isPlayerReady) return alert("Cargando reproductor...");
      document.getElementById('current-title').innerText = title;
      document.getElementById('current-artist').innerText = artist;
      document.getElementById('current-cover').src = cover;
      ytPlayer.loadVideoById(id);
    }

    function togglePlay() {
      if (!ytPlayer || !isPlayerReady) return;
      if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
      else ytPlayer.playVideo();
    }

    function seekAudio(val) {
      if (ytPlayer && isPlayerReady && ytPlayer.getDuration()) {
        ytPlayer.seekTo((val / 100) * ytPlayer.getDuration(), true);
      }
    }

    setInterval(() => {
      if (ytPlayer && isPlayerReady && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;
        if (dur > 0) {
          document.getElementById('seek-bar').value = (cur / dur) * 100;
          document.getElementById('time-current').innerText = `${Math.floor(cur/60)}:${Math.floor(cur%60).toString().padStart(2,'0')}`;
          document.getElementById('time-duration').innerText = `${Math.floor(dur/60)}:${Math.floor(dur%60).toString().padStart(2,'0')}`;
        }
      }
    }, 500);

    window.onload = () => {
      lucide.createIcons();
      searchMusic("Coldplay");
    };
  </script>
</body>
</html>
